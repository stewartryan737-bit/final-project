<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Schedule</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="post__search">
      <a href="index.html"><button type="button">← Back to teams</button></a>
      <div class="post__search--container">
        <label class="post__search--label" for="team-id">Search by team ID</label>

    <section class="team-detail">

    </section>
    <div class="post-list"></div>
  </div>
  <script src="user.js"></script>
</body>
</html>
